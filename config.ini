[server]
; Gateway listener. run.bat reads this port; connect with an RDP client manually.
host = 0.0.0.0
port = 3091
graphics_codec = auto

; Actual Windows Remote Desktop service receiving the authenticated connection.
native_host = 127.0.0.1
native_port = 3389

; Maximum screen updates per second. Set to 0 for uncapped.
max_fps = 0
; Scale browser capture internally; output is resized to the negotiated RDP size.
; 0.25 captures one sixteenth of the pixels; output keeps the RDP desktop size.
render_scale = 1.0
; Smaller update packets reduce receive stalls on slow links (1024 to 16000).
bitmap_chunk_bytes = 4096
; OTP portal: max (16-bpp RGB565 + RLE), standard/on (24-bpp + RLE), off (24-bpp raw).
bitmap_compression = max
; NSCodec Surface Bits caused incomplete tile rendering with MSTSC; keep off unless explicitly testing it.
nscodec_surface_updates = false
; Optional delay between bitmap bands, in seconds.
band_delay = 0
redirect_drain_seconds = 15
disable_hybrid_ex = false

[otp]
; Code lifetime in seconds (5 to 600).
ttl_seconds = 60
; Failed entries allowed per connection.
max_attempts = 3
; Maximum code sends per client address in the rolling window.
max_sends = 5
send_window_seconds = 600

[routing_ticket]
; How long an authenticated RDP handoff remains valid.
ttl_seconds = 900
max_uses = 16
; Set true to reject reconnects when the client IP changes.
bind_source = false

[notify]
; Notification URL, for example https://ntfy.sh/your-private-topic.
; Keep private: anyone who knows this URL may be able to publish to the topic.
url =

